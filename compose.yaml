services:
  agent-over-protocol:
    build:
      context: .
      dockerfile: Containerfile
    image: agent-over-protocol:latest
    restart: always
    environment:
      AGENT_BASE_URL: "${AGENT_BASE_URL}"
      LLM_API_KEY: "${LLM_API_KEY}"
    volumes:
      - agent-context:/context
      - agent-data:/data
    depends_on:
      - tika
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: always
    environment:
      FB_PORT: "8080"
    volumes:
      - agent-context:/srv
      - filebrowser-db:/database
    command:
      - --address
      - 0.0.0.0
      - --port
      - "8080"
      - --root
      - /srv
      - --database
      - /database/filebrowser.db

  tika:
    image: apache/tika:latest-full
    restart: always

volumes:
  agent-context:
  agent-data:
  filebrowser-db:
